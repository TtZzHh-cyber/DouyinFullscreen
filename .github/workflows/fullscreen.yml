name: Build Fullscreen APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project files
        run: |
          set -e
          mkdir -p proj2/app/src/main/java/com/example/douyinfullscreen proj2/app/src/main/assets proj2/app/src/main/res/values
          cat > proj2/settings.gradle <<'EOF_X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = 'DouyinFullscreen'
          include ':app'
          EOF_X
          cat > proj2/build.gradle <<'EOF_X'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_X
          cat > proj2/gradle.properties <<'EOF_X'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_X
          cat > proj2/app/build.gradle <<'EOF_X'
          plugins { id 'com.android.application' }
          
          android {
              namespace 'com.example.douyinfullscreen'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.douyinfullscreen'
                  minSdk 24
                  targetSdk 34
                  versionCode 11
                  versionName '2.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          
          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF_X
          cat > proj2/app/src/main/AndroidManifest.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="抖音全屏"
                  android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="抖音首页视频铺满全屏，底栏透明" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          EOF_X
          cat > proj2/app/src/main/res/values/arrays.xml <<'EOF_X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.ss.android.ugc.aweme</item>
              </string-array>
          </resources>
          EOF_X
          cat > proj2/app/src/main/assets/xposed_init <<'EOF_X'
          com.example.douyinfullscreen.MainHook
          EOF_X
          cat > proj2/app/src/main/java/com/example/douyinfullscreen/MainHook.java <<'EOF_X'
          package com.example.douyinfullscreen;
          
          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.SystemClock;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewParent;
          import android.view.ViewTreeObserver;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.CompoundButton;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          
          import java.lang.ref.WeakReference;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.Map;
          import java.util.WeakHashMap;
          
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          
          /**
           * 抖音首页全屏：
           * 1. 画面铺满：只放大视频画面，让它盖住底栏区域，文案和按钮位置不变；
           * 2. 底栏背景透明 / 完全隐藏（位置仍可点击）；
           * 3. 底栏区域纯黑；
           * 4. 接缝黑边处理与底部补色。
           * 设置入口在抖音「设置」页底部。所有改动都在绘制前完成。
           */
          public class MainHook implements IXposedHookLoadPackage {
          
              private static final String PKG = "com.ss.android.ugc.aweme";
              private static final String PREF = "douyin_fullscreen_cfg";
              private static final String ENTRY_TAG = "dfs_entry";
              private static final String PAGER_CLASS = "com.ss.android.ugc.aweme.common.widget.RTViewPager";
              private static final String[] MARKERS = {"账号与安全", "隐私设置", "通用设置"};
          
              // ---- 设置 ----
              private static volatile boolean coverVideo = true;
              private static volatile boolean barTransparent = true;
              private static volatile boolean barHide = false;
              private static volatile boolean seamFix = true;
              private static volatile boolean pureBlack = false;
              private static boolean cfgLoaded = false;
              private static boolean menuShowing = false;
          
              // ---- 首页状态（仅在主线程使用）----
              private static WeakReference<View> listenerDecor;
              private static WeakReference<View> pagerRef;
              private static WeakReference<Activity> feedActivity;
              private static final Rect tmpRect = new Rect();
              private static final int[] tmpLoc = new int[2];
              private static long lastScan = 0;
              private static long lastVisibleTime = 0;
              private static long lastPartScan = 0;
              private static long lastCornerScan = 0;
              private static long lastBlackScan = 0;
              private static long lastBarScan = 0;
              private static int scanMiss = 0;
              private static boolean unclipped = false;
          
              // 画面铺满
              private static final WeakHashMap<View, View[]> itemParts = new WeakHashMap<>();
              private static final WeakHashMap<View, Float> touched = new WeakHashMap<>();
              private static final WeakHashMap<View, Float> shiftSet = new WeakHashMap<>();
              private static final WeakHashMap<View, Float> shiftBase = new WeakHashMap<>();
              private static final WeakHashMap<View, ArrayList<View>> leafCache = new WeakHashMap<>();
              private static final WeakHashMap<View, ArrayList<View>> bgCache = new WeakHashMap<>();
              private static final WeakHashMap<View, Boolean> stretched = new WeakHashMap<>();
              private static final WeakHashMap<View, ColorDrawable> fills = new WeakHashMap<>();
          
              // 接缝小控件
              private static final ArrayList<WeakReference<View>> corners = new ArrayList<>();
              private static final ArrayList<Float> cornerAlphas = new ArrayList<>();
          
              // 底栏
              private static int barMode = 0; // 0 = 未处理，1 = 背景透明，2 = 完全隐藏
              private static final ArrayList<WeakReference<View>> bars = new ArrayList<>();
              private static final ArrayList<Float> barAlphas = new ArrayList<>();
              private static final ArrayList<WeakReference<View>> bgViews = new ArrayList<>();
              private static final ArrayList<Drawable> bgSaved = new ArrayList<>();
          
              // 纯黑
              private static final ArrayList<WeakReference<View>> blackViews = new ArrayList<>();
              private static final ArrayList<Drawable> blackSaved = new ArrayList<>();
              private static boolean winApplied = false;
              private static Drawable winBgSaved;
          
              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  if (!PKG.equals(lpparam.packageName) || !PKG.equals(lpparam.processName)) return;
                  try {
                      XposedHelpers.findAndHookMethod(Activity.class, "onResume", new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam p) {
                              try {
                                  Activity a = (Activity) p.thisObject;
                                  loadCfg(a);
                                  if (a.getClass().getName().endsWith(".main.MainActivity")) {
                                      attachFeedListener(a);
                                  } else {
                                      scheduleEntryCheck(a);
                                  }
                              } catch (Throwable ignored) { }
                          }
                      });
                  } catch (Throwable ignored) { }
              }
          
              // ================= 首页 =================
          
              private static void attachFeedListener(Activity a) {
                  final View decor = a.getWindow().getDecorView();
                  feedActivity = new WeakReference<Activity>(a);
                  if (listenerDecor != null && listenerDecor.get() == decor) return;
                  listenerDecor = new WeakReference<View>(decor);
                  pagerRef = null;
                  unclipped = false;
                  restoreBar();
          
                  ViewTreeObserver vto = decor.getViewTreeObserver();
                  if (!vto.isAlive()) return;
                  vto.addOnPreDrawListener(new ViewTreeObserver.OnPreDrawListener() {
                      @Override
                      public boolean onPreDraw() {
                          try {
                              feedFix(decor);
                          } catch (Throwable ignored) { }
                          return true;
                      }
                  });
              }
          
              /** 每帧绘制前调用 */
              private static void feedFix(View decor) {
                  int W = decor.getWidth();
                  int H = decor.getHeight();
                  if (W <= 0 || H <= 0) return;
                  long now = SystemClock.uptimeMillis();
          
                  View pager = pagerRef != null ? pagerRef.get() : null;
                  if (pager == null || pager.getWindowToken() == null || !isFeedVisible(pager, W, H)) {
                      // 短暂不可见（换视频、刷新）时不恢复，避免底部闪一下；持续不在首页才恢复
                      if (now - lastVisibleTime > 600) {
                          restoreBar();
                          resetCover();
                          restoreCorners();
                          restorePureBlack();
                      }
                      if (now - lastScan >= 500) {
                          lastScan = now;
                          View found = findFeedPager(decor, W, H);
                          if (found != pager) {
                              pagerRef = found == null ? null : new WeakReference<View>(found);
                              unclipped = false;
                          }
                      }
                      return;
                  }
          
                  lastVisibleTime = now;
                  if (coverVideo) applyCover(pager, H, now);
                  else resetCover();
                  pager.getLocationInWindow(tmpLoc);
                  int pagerBottom = tmpLoc[1] + pager.getHeight();
                  fixSeam(decor, W, pagerBottom, gapOf(H, pagerBottom), now);
                  applyBar(decor, pager, W, H, now);
                  applyPureBlack(decor, pager, W, H, now);
              }
          
              /** 视频流底边到屏幕底边的缺口（即原底栏占的高度），不在合理范围内则当作没有 */
              private static int gapOf(int H, int pagerBottom) {
                  int g = H - pagerBottom;
                  return (g >= 2 && g <= 0.10f * H) ? g : 0;
              }
          
              private static boolean isFeedVisible(View pager, int W, int H) {
                  if (!pager.isShown() || pager.getWidth() <= 0) return false;
                  if (!pager.getGlobalVisibleRect(tmpRect)) return false;
                  return tmpRect.width() >= 0.9f * W && tmpRect.height() >= 0.6f * H;
              }
          
              /** 按类名找到首页视频流的翻页控件（RTViewPager） */
              private static View findFeedPager(View v, int W, int H) {
                  if (v.getVisibility() != View.VISIBLE) return null;
                  if (PAGER_CLASS.equals(v.getClass().getName()) && isFeedVisible(v, W, H)) return v;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          View r = findFeedPager(g.getChildAt(i), W, H);
                          if (r != null) return r;
                      }
                  }
                  return null;
              }
          
              // ================= 画面铺满（只放大视频，文案和按钮不动） =================
          
              private static View findPart(View v, String suffix, int depth) {
                  if (v.getClass().getName().endsWith(suffix)) return v;
                  if (depth <= 0 || !(v instanceof ViewGroup)) return null;
                  ViewGroup g = (ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) {
                      View r = findPart(g.getChildAt(i), suffix, depth - 1);
                      if (r != null) return r;
                  }
                  return null;
              }
          
              private static void unclipUp(View from, View stop) {
                  ViewParent p = from.getParent();
                  while (p instanceof ViewGroup) {
                      ((ViewGroup) p).setClipChildren(false);
                      if (p == stop) break;
                      p = p.getParent();
                  }
              }
          
              /** v 在 root 坐标系里的顶部位置（只累加布局位置，不含缩放/平移，所以不受我们自己改动的影响） */
              private static float topIn(View v, View root) {
                  float t = 0f;
                  View cur = v;
                  int guard = 0;
                  while (cur != null && cur != root && guard++ < 12) {
                      t += cur.getTop();
                      ViewParent pp = cur.getParent();
                      cur = pp instanceof View ? (View) pp : null;
                  }
                  return t;
              }
          
              /**
               * 只对视频画面（VideoPinchViewContainer 及封面）做缩放/平移，让视频盖住底栏区域；
               * 文案、按钮、进度条等不做任何改动，所以位置完全不变。
               */
              private static void applyCover(View pager, int H, long now) {
                  if (!(pager instanceof ViewGroup)) return;
                  ViewGroup pg = (ViewGroup) pager;
                  pager.getLocationInWindow(tmpLoc);
                  int pagerTop = tmpLoc[1];
                  int gap = gapOf(H, pagerTop + pager.getHeight());
                  if (gap > 0 && !unclipped) {
                      pg.setClipChildren(false);
                      unclipUp(pager, null);
                      unclipped = true;
                  }
          
                  boolean scan = now - lastPartScan >= 250;
                  if (scan) lastPartScan = now;
          
                  for (int i = 0; i < pg.getChildCount(); i++) {
                      View item = pg.getChildAt(i);
                      int rw = item.getWidth();
                      int rh = item.getHeight();
                      if (rw <= 0 || rh <= 0) continue;
          
                      // 间距补偿：每页按它离视频流顶部的距离做平移，让页与页之间的视觉间距等于「页高+缺口」，
                      // 这样每页伸进底栏区域的画面刚好接上下一页，翻页全程没有黑条，也不会露出相邻页。
                      // 页面停稳时补偿为 0，文案和按钮位置不变。
                      shiftItem(item, gap, pagerTop);
          
                      View[] parts = itemParts.get(item);
                      if (parts == null) {
                          parts = new View[2];
                          itemParts.put(item, parts);
                          if (item instanceof ViewGroup) ((ViewGroup) item).setClipChildren(false);
                      }
                      if (parts[0] == null) { // 视频画面控件每帧都找（很浅，开销小），避免新页面的放大来得晚而跳一下
                          View c = findPart(item, ".VideoPinchViewContainer", 3);
                          if (c != null) {
                              parts[0] = c;
                              unclipUp(c, item);
                          }
                      }
                      if (parts[1] == null && scan) parts[1] = findPart(item, ".CoverImageView", 9);
                      View container = parts[0];
                      View cover = parts[1];
          
                      if (container == null) {
                          // 不是普通视频页（如直播页）：把页面里铺满的大图/视频控件放大，文字按钮等小控件不动
                          int n = scaleMediaLeaves(item, rw, rh, gap, scan);
                          fillBottom(item, rw, rh, gap, n > 0, scan);
                          continue;
                      }
                      if (!(container instanceof ViewGroup) || ((ViewGroup) container).getChildCount() == 0) continue;
          
                      View inner = ((ViewGroup) container).getChildAt(0);
                      int iw = inner.getWidth();
                      int ih = inner.getHeight();
          
                      float s = 1f;
                      float ty = 0f;
                      boolean covered = false;
                      if (iw > 0 && ih > 0 && iw < ih * 0.9f) { // 只处理竖屏视频，横屏视频保持原样
                          float want = Math.max((float) rw / iw, (rh + gap) / (float) ih);
                          if (want <= 1.35f) {
                              s = Math.max(want, 1f);
                              // 以容器中心为轴缩放，再平移到刚好盖住页面底部；
                              // 视频本身比页面高且居中时，也能补上被裁掉的那一截（否则底部会留黑边）
                              float pivot = topIn(container, item) + container.getHeight() / 2f;
                              float top0 = topIn(inner, item);
                              float top1 = pivot + (top0 - pivot) * s;
                              float bot1 = pivot + (top0 + ih - pivot) * s;
                              float lo = (rh + gap) - bot1; // 至少平移这么多才能盖住底部
                              float hi = -top1;             // 至多平移这么多才不露出顶部
                              if (lo > ty) ty = lo;
                              if (ty > hi) ty = hi;
                              if (Math.abs(ty) < 0.5f) ty = 0f;
                              covered = true;
                          }
                      }
                      setCover(container, s, ty);
                      if (cover != null) setCover(cover, s, ty);
                      fillBottom(item, rw, rh, gap, covered, scan);
                  }
              }
          
              /** 让每页的视觉间距等于「页高+缺口」；topBase 去掉了我们自己上一帧加的平移，避免反馈抖动 */
              private static void shiftItem(View item, int gap, int pagerTop) {
                  float cur = item.getTranslationY();
                  Float ls = shiftSet.get(item);
                  Float bs = shiftBase.get(item);
                  float base;
                  float prev;
                  if (ls != null && bs != null && cur == ls) {
                      base = bs;
                      prev = ls - bs;
                  } else {
                      base = cur; // 第一次，或抖音自己改过平移：以它当前的值为准
                      prev = 0f;
                  }
                  float nt = base;
                  if (gap > 0 && item.getHeight() > 0) {
                      item.getLocationInWindow(tmpLoc);
                      float topBase = tmpLoc[1] - prev;
                      nt = base + (topBase - pagerTop) * gap / item.getHeight();
                  }
                  if (nt != cur) item.setTranslationY(nt);
                  shiftSet.put(item, nt);
                  shiftBase.put(item, base);
              }
          
              private static void collectLeaves(View v, int rw, int rh, int depth, ArrayList<View> out) {
                  if (depth > 6 || out.size() >= 6) return;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collectLeaves(g.getChildAt(i), rw, rh, depth + 1, out);
                  } else if (v.getWidth() >= 0.9f * rw && v.getHeight() >= 0.6f * rh) {
                      out.add(v);
                  }
              }
          
              /** 非视频页：放大页面里铺满的大图/视频控件（叶子控件），文字按钮等小控件不动 */
              private static int scaleMediaLeaves(View item, int rw, int rh, int gap, boolean scan) {
                  ArrayList<View> leaves = leafCache.get(item);
                  if (leaves == null || (leaves.isEmpty() && scan)) {
                      leaves = new ArrayList<>();
                      collectLeaves(item, rw, rh, 0, leaves);
                      leafCache.put(item, leaves);
                      if (item instanceof ViewGroup) ((ViewGroup) item).setClipChildren(false);
                      for (int i = 0; i < leaves.size(); i++) unclipUp(leaves.get(i), item);
                  }
                  int n = 0;
                  for (int i = 0; i < leaves.size(); i++) {
                      View l = leaves.get(i);
                      int lw = l.getWidth();
                      int lh = l.getHeight();
                      if (lw <= 0 || lh <= 0) continue;
                      float s = 1f;
                      float ty = 0f;
                      float want = Math.max((float) rw / lw, (rh + gap) / (float) lh);
                      if (want > 1.01f && want <= 1.35f) {
                          s = want;
                          ty = gap / 2f;
                      }
                      setCover(l, s, ty);
                      if (s > 1f || topIn(l, item) + lh >= rh + gap - 2) n++;
                  }
                  return n;
              }
          
              private static void setCover(View v, float s, float ty) {
                  Float prev = touched.get(v);
                  float cur = v.getScaleX();
                  if (cur != 1f && (prev == null || cur != prev)) return; // 别处（如双指缩放）正在改，不干预
                  if (s == 1f && ty == 0f && prev == null) return;
                  if (cur != s) {
                      v.setScaleX(s);
                      v.setScaleY(s);
                  }
                  if (v.getTranslationY() != ty) v.setTranslationY(ty);
                  touched.put(v, s);
              }
          
              private static void resetCover() {
                  if (!stretched.isEmpty()) {
                      for (View v : stretched.keySet()) {
                          if (v != null) {
                              v.setScaleY(1f);
                              v.setPivotY(v.getHeight() / 2f);
                          }
                      }
                      stretched.clear();
                  }
                  bgCache.clear();
                  if (!fills.isEmpty()) {
                      for (Map.Entry<View, ColorDrawable> e : fills.entrySet()) {
                          View v = e.getKey();
                          if (v != null && e.getValue() != null) v.getOverlay().remove(e.getValue());
                      }
                      fills.clear();
                  }
                  if (!shiftSet.isEmpty()) {
                      for (Map.Entry<View, Float> e : shiftSet.entrySet()) {
                          View v = e.getKey();
                          Float ls = e.getValue();
                          Float bs = shiftBase.get(v);
                          if (v != null && ls != null && bs != null && v.getTranslationY() == ls) {
                              v.setTranslationY(bs);
                          }
                      }
                      shiftSet.clear();
                      shiftBase.clear();
                  }
                  if (touched.isEmpty()) return;
                  for (Map.Entry<View, Float> e : touched.entrySet()) {
                      View v = e.getKey();
                      Float s = e.getValue();
                      if (v != null && s != null && v.getScaleX() == s) {
                          v.setScaleX(1f);
                          v.setScaleY(1f);
                          v.setTranslationY(0f);
                      }
                  }
                  touched.clear();
              }
          
              // ---- 画面没有铺到底的页面（横屏视频、图文等）：补底 ----
          
              private static void collectBgImages(View v, int depth, int w, int h, ArrayList<View> out) {
                  if (out.size() >= 3) return;
                  if (v instanceof ImageView && v.getVisibility() == View.VISIBLE
                          && v.getWidth() >= 0.95f * w && v.getHeight() >= 0.95f * h) {
                      out.add(v);
                      return;
                  }
                  if (depth <= 0 || !(v instanceof ViewGroup)) return;
                  ViewGroup g = (ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) collectBgImages(g.getChildAt(i), depth - 1, w, h, out);
              }
          
              /**
               * 页面里通常有一张铺满整页的模糊背景图，把它沿竖直方向拉伸（顶部不动），盖住底栏区域；
               * 视频本身、文案、按钮都不动。返回是否拉伸了背景图。
               */
              private static boolean stretchBackground(View item, int rw, int rh, int gap, boolean covered, boolean scan) {
                  ArrayList<View> bgs = bgCache.get(item);
                  if (!seamFix || gap <= 0 || covered) {
                      if (bgs != null) {
                          for (int i = 0; i < bgs.size(); i++) {
                              View v = bgs.get(i);
                              if (stretched.remove(v) != null) {
                                  v.setScaleY(1f);
                                  v.setPivotY(v.getHeight() / 2f);
                              }
                          }
                          bgCache.remove(item);
                      }
                      return false;
                  }
                  if (bgs == null || (bgs.isEmpty() && scan)) {
                      bgs = new ArrayList<View>();
                      collectBgImages(item, 2, rw, rh, bgs);
                      for (int i = 0; i < bgs.size(); i++) unclipUp(bgs.get(i), item);
                      bgCache.put(item, bgs);
                  }
                  float sy = (rh + gap) / (float) rh;
                  int n = 0;
                  for (int i = 0; i < bgs.size(); i++) {
                      View v = bgs.get(i);
                      if (v.getHeight() <= 0) continue;
                      if (v.getPivotY() != 0f) v.setPivotY(0f);
                      if (v.getScaleY() != sy) v.setScaleY(sy);
                      stretched.put(v, Boolean.TRUE);
                      n++;
                  }
                  return n > 0;
              }
          
              private static void scanColor(View v, View item, int rw, int rh, int depth, int[] bestH, Integer[] best) {
                  if (v.getVisibility() != View.VISIBLE) return;
                  if (v != item) {
                      Drawable d = v.getBackground();
                      int h = v.getHeight();
                      if (d instanceof ColorDrawable && v.getWidth() >= 0.9f * rw && h >= 20 && h < bestH[0]) {
                          int c = ((ColorDrawable) d).getColor();
                          if (Color.alpha(c) >= 200 && topIn(v, item) + h >= rh - 2) {
                              bestH[0] = h;
                              best[0] = c;
                          }
                      }
                  }
                  if (depth < 6 && v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) scanColor(g.getChildAt(i), item, rw, rh, depth + 1, bestH, best);
                  }
              }
          
              /** 找不到背景图时：用页面底部通栏控件的底色，在页面下方补一条同色条 */
              private static void updateFill(View item, int rw, int rh, int gap, boolean covered, boolean scan) {
                  ColorDrawable fd = fills.get(item);
                  if (!seamFix || gap <= 0 || covered) {
                      if (fd != null) {
                          item.getOverlay().remove(fd);
                          fills.remove(item);
                      }
                      return;
                  }
                  if (!scan) {
                      if (fd != null) fd.setBounds(0, rh, rw, rh + gap);
                      return;
                  }
                  int[] bestH = {Integer.MAX_VALUE};
                  Integer[] best = new Integer[1];
                  scanColor(item, item, rw, rh, 0, bestH, best);
                  if (best[0] == null) {
                      if (fd != null) {
                          item.getOverlay().remove(fd);
                          fills.remove(item);
                      }
                      return;
                  }
                  int color = best[0];
                  if (fd == null) {
                      fd = new ColorDrawable(color);
                      item.getOverlay().add(fd);
                      fills.put(item, fd);
                  } else if (fd.getColor() != color) {
                      fd.setColor(color);
                  }
                  fd.setBounds(0, rh, rw, rh + gap);
              }
          
              private static void fillBottom(View item, int rw, int rh, int gap, boolean covered, boolean scan) {
                  boolean st = stretchBackground(item, rw, rh, gap, covered, scan);
                  updateFill(item, rw, rh, gap, covered || st, scan);
              }
          
              // ================= 接缝黑边 =================
          
              /** 视频流底边两侧的小圆角图片（贴着屏幕左右边缘的小叶子控件）会在接缝处留黑边，隐藏它们 */
              private static void scanCorners(View v, int W, int J, ArrayList<View> out) {
                  if (v.getVisibility() != View.VISIBLE || out.size() >= 6) return;
                  int w = v.getWidth();
                  int h = v.getHeight();
                  boolean leaf = !(v instanceof ViewGroup) || ((ViewGroup) v).getChildCount() == 0;
                  if (w > 0 && h > 0 && leaf && !(v instanceof TextView)) {
                      boolean small = w <= 120 && h <= 120;
                      boolean thin = w >= 0.9f * W && h <= 70;
                      if (small || thin) {
                          v.getLocationInWindow(tmpLoc);
                          int cy = tmpLoc[1] + h / 2;
                          if (Math.abs(cy - J) <= (small ? 70 : 40)) {
                              boolean atEdge = tmpLoc[0] <= 6 || tmpLoc[0] + w >= W - 6;
                              String n = v.getClass().getName().toLowerCase(Locale.US);
                              boolean named = n.contains("corner") || n.contains("round") || n.contains("radius");
                              if ((small && atEdge) || (thin && named)) {
                                  out.add(v);
                                  return;
                              }
                          }
                      }
                  }
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) scanCorners(g.getChildAt(i), W, J, out);
                  }
              }
          
              private static void restoreCorners() {
                  for (int i = 0; i < corners.size(); i++) {
                      View v = corners.get(i).get();
                      if (v != null) v.setAlpha(i < cornerAlphas.size() ? cornerAlphas.get(i) : 1f);
                  }
                  corners.clear();
                  cornerAlphas.clear();
              }
          
              private static void fixSeam(View decor, int W, int J, int gap, long now) {
                  if (!seamFix || gap <= 0) {
                      restoreCorners();
                      return;
                  }
                  if (now - lastCornerScan >= 700) {
                      lastCornerScan = now;
                      ArrayList<View> found = new ArrayList<View>();
                      scanCorners(decor, W, J, found);
                      restoreCorners();
                      for (int i = 0; i < found.size(); i++) {
                          View v = found.get(i);
                          corners.add(new WeakReference<View>(v));
                          cornerAlphas.add(v.getAlpha());
                      }
                  }
                  for (int i = 0; i < corners.size(); i++) {
                      View v = corners.get(i).get();
                      if (v != null && v.getAlpha() != 0f) v.setAlpha(0f);
                  }
              }
          
              // ================= 底栏区域纯黑 =================
          
              private static void blackenIfColor(View v) {
                  Drawable d = v.getBackground();
                  if (!(d instanceof ColorDrawable)) return;
                  int c = ((ColorDrawable) d).getColor();
                  if (Color.alpha(c) == 0 || (c & 0x00FFFFFF) == 0) return; // 透明或已经是黑色
                  boolean known = false;
                  for (int i = 0; i < blackViews.size(); i++) {
                      if (blackViews.get(i).get() == v) known = true;
                  }
                  if (!known && blackViews.size() < 40) {
                      blackViews.add(new WeakReference<View>(v));
                      blackSaved.add(d);
                  }
                  v.setBackgroundColor(Color.BLACK);
              }
          
              /** 贴着屏幕底边、通栏、不包含视频流的底部控件（如底栏、占位控件）：它们的底色也改成黑 */
              private static void scanBottomColors(View v, View skip, int W, int H, int depth) {
                  if (v == skip || v.getVisibility() != View.VISIBLE || depth > 12) return;
                  int h = v.getHeight();
                  if (h > 0 && h <= 0.2f * H && v.getWidth() >= 0.9f * W) {
                      v.getLocationInWindow(tmpLoc);
                      if (tmpLoc[1] + h >= H - 3) blackenIfColor(v);
                  }
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) scanBottomColors(g.getChildAt(i), skip, W, H, depth + 1);
                  }
              }
          
              /**
               * 底栏区域露出来的灰色（抖音深色主题的深蓝灰底色）统一改成纯黑：
               * 窗口背景、视频流的各级父控件、底部通栏控件的纯色底色。不缩放、不移动任何内容。
               */
              private static void applyPureBlack(View decor, View pager, int W, int H, long now) {
                  if (!pureBlack) {
                      restorePureBlack();
                      return;
                  }
                  if (now - lastBlackScan < 500) return;
                  lastBlackScan = now;
          
                  Activity a = feedActivity != null ? feedActivity.get() : null;
                  if (a != null && !winApplied) {
                      winBgSaved = decor.getBackground();
                      a.getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                      winApplied = true;
                  }
                  ViewParent p = pager.getParent();
                  int guard = 0;
                  while (p instanceof View && guard++ < 30) {
                      View v = (View) p;
                      if (v != decor) blackenIfColor(v);
                      p = v.getParent();
                  }
                  scanBottomColors(decor, pager, W, H, 0);
              }
          
              private static void restorePureBlack() {
                  if (!winApplied && blackViews.isEmpty()) return;
                  for (int i = 0; i < blackViews.size(); i++) {
                      View v = blackViews.get(i).get();
                      if (v != null && i < blackSaved.size()) v.setBackground(blackSaved.get(i));
                  }
                  blackViews.clear();
                  blackSaved.clear();
                  if (winApplied) {
                      Activity a = feedActivity != null ? feedActivity.get() : null;
                      if (a != null && winBgSaved != null) a.getWindow().setBackgroundDrawable(winBgSaved);
                      winApplied = false;
                  }
              }
          
              // ================= 底栏 =================
          
              private static void applyBar(View decor, View pager, int W, int H, long now) {
                  int want = barHide ? 2 : (barTransparent ? 1 : 0);
                  if (want != barMode) restoreBar();
                  if (want == 0) return;
          
                  boolean alive = !bars.isEmpty();
                  for (int i = 0; alive && i < bars.size(); i++) {
                      View v = bars.get(i).get();
                      if (v == null || v.getWindowToken() == null) alive = false;
                  }
                  if (!alive) {
                      // 底栏被抖音重建时立即重新寻找（连续多次找不到才降频），避免底栏闪出来
                      if (scanMiss >= 15 && now - lastBarScan < 500) return;
                      lastBarScan = now;
                      bars.clear();
                      barAlphas.clear();
                      bgViews.clear();
                      bgSaved.clear();
                      barMode = 0;
                      findBars(decor, pager, W, H);
                      if (bars.isEmpty()) {
                          scanMiss++;
                          return;
                      }
                      scanMiss = 0;
                  }
          
                  if (want == 2) {
                      if (barMode != 2) {
                          barAlphas.clear();
                          for (int i = 0; i < bars.size(); i++) {
                              View v = bars.get(i).get();
                              barAlphas.add(v == null ? 1f : v.getAlpha());
                          }
                          barMode = 2;
                      }
                      for (int i = 0; i < bars.size(); i++) {
                          View v = bars.get(i).get();
                          if (v != null && v.getAlpha() != 0f) v.setAlpha(0f);
                      }
                  } else {
                      if (barMode != 1) {
                          bgViews.clear();
                          bgSaved.clear();
                          for (int i = 0; i < bars.size(); i++) {
                              View bar = bars.get(i).get();
                              if (bar == null) continue;
                              collectBg(bar, 0);
                              ViewParent pp = bar.getParent();
                              if (pp instanceof ViewGroup) {
                                  ViewGroup g = (ViewGroup) pp;
                                  for (int k = 0; k < g.getChildCount(); k++) {
                                      View c = g.getChildAt(k);
                                      if (c == bar || c == pager || c.getVisibility() != View.VISIBLE) continue;
                                      c.getLocationInWindow(tmpLoc);
                                      if (c.getWidth() >= 0.9f * W && c.getHeight() <= 0.2f * H
                                              && tmpLoc[1] + c.getHeight() >= H - 3) {
                                          collectBg(c, 0);
                                      }
                                  }
                              }
                          }
                          barMode = 1;
                      }
                      for (int i = 0; i < bgViews.size(); i++) {
                          View v = bgViews.get(i).get();
                          if (v != null && v.getBackground() != null) v.setBackground(null);
                      }
                  }
              }
          
              private static void collectBg(View v, int depth) {
                  Drawable d = v.getBackground();
                  if (d != null) {
                      bgViews.add(new WeakReference<View>(v));
                      bgSaved.add(d);
                  }
                  if (depth < 3 && v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collectBg(g.getChildAt(i), depth + 1);
                  }
              }
          
              private static void restoreBar() {
                  if (barMode == 0) return;
                  if (barMode == 2) {
                      for (int i = 0; i < bars.size(); i++) {
                          View v = bars.get(i).get();
                          if (v != null) v.setAlpha(i < barAlphas.size() ? barAlphas.get(i) : 1f);
                      }
                  } else if (barMode == 1) {
                      for (int i = 0; i < bgViews.size(); i++) {
                          View v = bgViews.get(i).get();
                          if (v != null) v.setBackground(bgSaved.get(i));
                      }
                      bgViews.clear();
                      bgSaved.clear();
                  }
                  barMode = 0;
              }
          
              /** 找出所有「首页/消息/我」文字所在的底部通栏容器（可能有多个，全部处理） */
              private static void findBars(View decor, View pager, int W, int H) {
                  ArrayList<View> tabs = new ArrayList<>();
                  collectTabTexts(decor, pager, H, tabs);
                  for (int t = 0; t < tabs.size(); t++) {
                      View best = null;
                      View p = tabs.get(t);
                      while (p != null) {
                          int h = p.getHeight();
                          if (h > 0.2f * H) break;
                          p.getLocationInWindow(tmpLoc);
                          if (p.getWidth() >= 0.9f * W && tmpLoc[1] + h >= H - 3) best = p;
                          ViewParent pp = p.getParent();
                          p = pp instanceof View ? (View) pp : null;
                      }
                      if (best == null) continue;
                      boolean dup = false;
                      for (int i = 0; i < bars.size(); i++) {
                          if (bars.get(i).get() == best) dup = true;
                      }
                      if (!dup && bars.size() < 4) bars.add(new WeakReference<View>(best));
                  }
              }
          
              private static void collectTabTexts(View v, View skip, int H, ArrayList<View> out) {
                  if (v == skip || v.getVisibility() != View.VISIBLE || out.size() >= 12) return;
                  if (v instanceof TextView) {
                      CharSequence t = ((TextView) v).getText();
                      if (t != null) {
                          String x = t.toString().trim();
                          if (x.equals("首页") || x.equals("消息") || x.equals("我")) {
                              v.getLocationInWindow(tmpLoc);
                              if (tmpLoc[1] >= 0.8f * H) out.add(v);
                          }
                      }
                  }
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collectTabTexts(g.getChildAt(i), skip, H, out);
                  }
              }
          
              // ================= 配置 =================
          
              private static void loadCfg(Context c) {
                  if (cfgLoaded) return;
                  cfgLoaded = true;
                  try {
                      SharedPreferences sp = c.getSharedPreferences(PREF, 0);
                      coverVideo = sp.getBoolean("coverVideo", true);
                      barTransparent = sp.getBoolean("barTransparent", true);
                      barHide = sp.getBoolean("barHide", false);
                      seamFix = sp.getBoolean("seamFix", true);
                      pureBlack = sp.getBoolean("pureBlack", false);
                  } catch (Throwable ignored) { }
              }
          
              private static void saveCfg(Context c) {
                  try {
                      c.getSharedPreferences(PREF, 0).edit()
                              .putBoolean("coverVideo", coverVideo)
                              .putBoolean("barTransparent", barTransparent)
                              .putBoolean("barHide", barHide)
                              .putBoolean("seamFix", seamFix)
                              .putBoolean("pureBlack", pureBlack)
                              .apply();
                  } catch (Throwable ignored) { }
              }
          
              // ================= 设置页入口 =================
          
              private static void collectMarkers(View v, boolean[] found) {
                  if (v.getVisibility() != View.VISIBLE) return;
                  if (v instanceof TextView) {
                      CharSequence t = ((TextView) v).getText();
                      if (t != null) {
                          String x = t.toString().trim();
                          for (int i = 0; i < MARKERS.length; i++) {
                              if (x.equals(MARKERS[i])) found[i] = true;
                          }
                      }
                  }
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collectMarkers(g.getChildAt(i), found);
                  }
              }
          
              private static boolean isSettingsPage(View root) {
                  boolean[] found = new boolean[MARKERS.length];
                  collectMarkers(root, found);
                  int n = 0;
                  for (boolean f : found) if (f) n++;
                  return n >= 2;
              }
          
              private static void scheduleEntryCheck(final Activity a) {
                  View decor = a.getWindow().getDecorView();
                  if (!(decor instanceof FrameLayout)) return;
                  final FrameLayout fl = (FrameLayout) decor;
                  if (fl.findViewWithTag(ENTRY_TAG) != null) return;
                  final int[] tries = {0};
                  fl.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (a.isFinishing() || fl.findViewWithTag(ENTRY_TAG) != null) return;
                              if (isSettingsPage(fl)) {
                                  addEntry(a, fl);
                                  return;
                              }
                          } catch (Throwable ignored) { }
                          if (++tries[0] < 4) fl.postDelayed(this, 600);
                      }
                  }, 400);
              }
          
              private static int dp(Context c, int v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density + 0.5f);
              }
          
              private static void addEntry(final Activity a, FrameLayout fl) {
                  TextView bar = new TextView(a);
                  bar.setTag(ENTRY_TAG);
                  bar.setText("全屏设置  ›");
                  bar.setTextColor(Color.WHITE);
                  bar.setTextSize(15);
                  bar.setGravity(Gravity.CENTER);
                  bar.setPadding(dp(a, 24), dp(a, 11), dp(a, 24), dp(a, 11));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xEE18A058);
                  bg.setCornerRadius(dp(a, 24));
                  bar.setBackground(bg);
                  bar.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { showMenu(a); }
                  });
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  lp.bottomMargin = dp(a, 120); // 在「弹簧动画设置」按钮上方，避免重叠
                  fl.addView(bar, lp);
              }
          
              // ================= 设置面板 =================
          
              private static void addSwitch(Activity a, LinearLayout root, String text, boolean checked,
                                            CompoundButton.OnCheckedChangeListener l) {
                  Switch sw = new Switch(a);
                  sw.setText(text);
                  sw.setTextColor(0xFF222222);
                  sw.setChecked(checked);
                  sw.setPadding(0, dp(a, 14), 0, 0);
                  sw.setOnCheckedChangeListener(l);
                  root.addView(sw);
              }
          
              private static void showMenu(final Activity a) {
                  if (menuShowing) return;
                  try {
                      final Dialog d = new Dialog(a);
                      d.requestWindowFeature(Window.FEATURE_NO_TITLE);
          
                      LinearLayout root = new LinearLayout(a);
                      root.setOrientation(LinearLayout.VERTICAL);
                      root.setPadding(dp(a, 20), dp(a, 18), dp(a, 20), dp(a, 8));
                      GradientDrawable bg = new GradientDrawable();
                      bg.setColor(0xFFFFFFFF);
                      bg.setCornerRadius(dp(a, 16));
                      root.setBackground(bg);
          
                      TextView title = new TextView(a);
                      title.setText("抖音全屏设置");
                      title.setTextColor(0xFF222222);
                      title.setTextSize(18);
                      title.setTypeface(null, Typeface.BOLD);
                      root.addView(title);
          
                      addSwitch(a, root, "画面铺满（只放大视频，文案按钮位置不变）", coverVideo,
                              new CompoundButton.OnCheckedChangeListener() {
                                  @Override
                                  public void onCheckedChanged(CompoundButton b, boolean c) {
                                      coverVideo = c;
                                      saveCfg(a);
                                  }
                              });
                      addSwitch(a, root, "底栏背景透明（保留图标，视频显示在下方）", barTransparent,
                              new CompoundButton.OnCheckedChangeListener() {
                                  @Override
                                  public void onCheckedChanged(CompoundButton b, boolean c) {
                                      barTransparent = c;
                                      saveCfg(a);
                                  }
                              });
                      addSwitch(a, root, "底栏完全隐藏（图标也不显示，位置仍可点击）", barHide,
                              new CompoundButton.OnCheckedChangeListener() {
                                  @Override
                                  public void onCheckedChanged(CompoundButton b, boolean c) {
                                      barHide = c;
                                      saveCfg(a);
                                  }
                              });
                      addSwitch(a, root, "底栏区域纯黑（把灰色改成黑色，不缩放视频）", pureBlack,
                              new CompoundButton.OnCheckedChangeListener() {
                                  @Override
                                  public void onCheckedChanged(CompoundButton b, boolean c) {
                                      pureBlack = c;
                                      saveCfg(a);
                                  }
                              });
                      addSwitch(a, root, "接缝黑边/底部补色", seamFix,
                              new CompoundButton.OnCheckedChangeListener() {
                                  @Override
                                  public void onCheckedChanged(CompoundButton b, boolean c) {
                                      seamFix = c;
                                      saveCfg(a);
                                  }
                              });
          
                      TextView tip = new TextView(a);
                      tip.setText("回到首页即生效。使用本模块时，请关闭其他模块里的全屏、隐藏底栏等功能，避免互相冲突。");
                      tip.setTextColor(0xFF888888);
                      tip.setTextSize(12);
                      tip.setPadding(0, dp(a, 14), 0, 0);
                      root.addView(tip);
          
                      TextView close = new TextView(a);
                      close.setText("关闭");
                      close.setTextColor(0xFF1A5CFF);
                      close.setTextSize(15);
                      close.setGravity(Gravity.CENTER);
                      close.setPadding(0, dp(a, 14), 0, dp(a, 10));
                      close.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) { d.dismiss(); }
                      });
                      root.addView(close, new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
          
                      ScrollView sv = new ScrollView(a);
                      sv.addView(root);
                      d.setContentView(sv);
                      d.getWindow().setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                      d.setOnDismissListener(new android.content.DialogInterface.OnDismissListener() {
                          @Override
                          public void onDismiss(android.content.DialogInterface di) { menuShowing = false; }
                      });
                      menuShowing = true;
                      d.show();
          
                      WindowManager.LayoutParams wl = new WindowManager.LayoutParams();
                      wl.copyFrom(d.getWindow().getAttributes());
                      wl.width = (int) (a.getResources().getDisplayMetrics().widthPixels * 0.88f);
                      d.getWindow().setAttributes(wl);
                  } catch (Throwable t) {
                      menuShowing = false;
                  }
              }
          }
